<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1a16">
<title>AlleyCat Foods Menu</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1d1a16; --muted:#6f675d; --line:#e8e1d6; --brand:#c8401e; --ok:#2e7d32; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom:120px; }
  header { padding:22px 16px 10px; }
  .brand { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); font-weight:800; }
  h1 { margin:4px 0 0; font-size:30px; }
  nav.switch { display:flex; gap:8px; padding:8px 16px 4px; }
  nav.switch a { flex:1; text-align:center; padding:10px; border-radius:999px; border:1px solid var(--line); color:var(--ink); text-decoration:none; font-weight:600; background:#fff; }
  nav.switch a.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .banner { margin:12px 16px 0; padding:14px 16px; border-radius:12px; background:#fff3e0; border:1px solid #f0c48a; font-weight:600; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:22px 16px 8px; }
  .items { display:grid; gap:10px; padding:0 16px; }
  .item { display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; align-items:center; }
  .item.has { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset; }
  .item.out { opacity:.5; }
  .item img { width:72px; height:72px; object-fit:cover; border-radius:10px; flex:none; }
  .info { flex:1; min-width:0; }
  .name { font-weight:700; }
  .desc { color:var(--muted); font-size:14px; margin-top:2px; }
  .meta { margin-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .price { font-weight:700; }
  .tag { font-size:12px; color:var(--muted); background:#f2ede5; padding:2px 8px; border-radius:999px; }
  .tag.out { background:#fde2dc; color:#a3301a; font-weight:700; }
  .qty { display:flex; align-items:center; gap:6px; flex:none; }
  .qty button, .step button { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:22px; line-height:1; color:var(--ink); cursor:pointer; }
  .qty button.plus, .step button.plus { background:var(--brand); border-color:var(--brand); color:#fff; }
  .qty button:disabled, .step button:disabled { opacity:.3; cursor:default; }
  .qty output, .step output { min-width:24px; text-align:center; font-weight:800; font-size:18px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(0,0,0,.06); z-index:5; }
  .btn { width:100%; padding:16px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:17px; font-weight:700; display:flex; justify-content:space-between; cursor:pointer; }
  .btn:disabled { background:#cfc7bc; cursor:default; }
  .msg { padding:40px 16px; text-align:center; color:var(--muted); }
  /* bottom sheets */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; padding:20px 16px calc(16px + env(safe-area-inset-bottom)); z-index:11; max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .22s ease; }
  .sheet.open { transform:none; } .scrim.open { display:block; }
  .sheet h3 { margin:0 0 4px; font-size:22px; }
  .sheet .sub { color:var(--muted); margin-bottom:14px; }
  .opt { display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); font-size:17px; }
  .opt input { width:24px; height:24px; accent-color:var(--brand); }
  .opt span { flex:1; } .opt small { color:var(--muted); font-size:15px; }
  .opt.out { opacity:.45; }
  .step { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0; }
  .line { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .line .l { flex:1; } .line .o { color:var(--muted); font-size:14px; }
  .line .x { border:0; background:none; color:var(--muted); font-size:22px; padding:0 4px; cursor:pointer; }
  .sum { display:flex; justify-content:space-between; padding:6px 0; color:var(--muted); }
  .sum.total { color:var(--ink); font-weight:800; font-size:19px; padding-top:10px; }
  .close { position:absolute; right:12px; top:12px; border:0; background:#f2ede5; width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="brand">AlleyCat Foods</div>
  <h1 id="title">Menu</h1>
</header>
<nav class="switch"><a href="/breakfast" id="nav-breakfast">Breakfast</a><a href="/lunch" id="nav-lunch">Lunch</a></nav>
<div id="banner"></div>
<main id="menu"><div class="msg">Loading menu…</div></main>
<div class="bar"><button class="btn" id="review" disabled><span id="count">Add items to order</span><span id="subtotal"></span></button></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="optSheet"></div>
<div class="sheet" id="cartSheet"></div>

<script>
const menu = location.pathname.replace(/\//g, '').toLowerCase() || 'lunch';
const key = 'cart2:' + menu;
let data = { items: [], paused: false, tax_percent: 8.25 }, byId = {}, cart = [];
try { cart = JSON.parse(sessionStorage.getItem(key)) || []; } catch (e) {}
const save = () => { try { sessionStorage.setItem(key, JSON.stringify(cart)); } catch (e) {} };
const money = c => '$' + (c / 100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

$('title').textContent = menu[0].toUpperCase() + menu.slice(1);
$('nav-' + menu)?.classList.add('on');

const lineUnit = l => { const it = byId[l.product]; return it.amount + l.options.reduce((s, k) => s + (it.options.find(o => o.key === k)?.amount || 0), 0); };
const countFor = id => cart.filter(l => l.product === id).reduce((s, l) => s + l.quantity, 0);
function totals() {
  const byPrice = {}; let count = 0, sub = 0;
  cart.forEach(l => {
    const it = byId[l.product]; if (!it) return;
    count += l.quantity; sub += lineUnit(l) * l.quantity;
    byPrice[it.price] = (byPrice[it.price] || 0) + it.amount * l.quantity;
    l.options.forEach(k => { const o = it.options.find(x => x.key === k); if (o && o.price) byPrice[o.price] = (byPrice[o.price] || 0) + o.amount * l.quantity; });
  });
  const tax = Object.values(byPrice).reduce((s, a) => s + Math.round(a * data.tax_percent / 100), 0);
  return { count, sub, tax, total: sub + tax };
}

function render() {
  $('banner').innerHTML = data.paused ? '<div class="banner">⏸ Online ordering is paused right now. Back shortly!</div>' : '';
  const groups = {};
  data.items.forEach(i => (groups[i.category] ||= []).push(i));
  $('menu').innerHTML = Object.entries(groups).map(([cat, list]) => `
    <h2>${esc(cat)}</h2>
    <div class="items">${list.map(i => `
      <div class="item ${i.sold_out ? 'out' : ''}" data-id="${i.id}">
        ${i.image ? `<img src="${esc(i.image)}" alt="">` : ''}
        <div class="info">
          <div class="name">${esc(i.name)}</div>
          ${i.description ? `<div class="desc">${esc(i.description)}</div>` : ''}
          <div class="meta"><span class="price">${money(i.amount)}</span>
            ${i.sold_out ? '<span class="tag out">Sold out</span>' : i.options.length ? `<span class="tag">${esc(i.options.map(o => o.label).join(' · '))}</span>` : ''}</div>
        </div>
        <div class="qty">
          <button class="minus" aria-label="Remove one">−</button>
          <output>0</output>
          <button class="plus" aria-label="Add one" ${i.sold_out || data.paused ? 'disabled' : ''}>+</button>
        </div>
      </div>`).join('')}
    </div>`).join('') || '<div class="msg">No items on this menu yet.</div>';
  update();
}

function update() {
  document.querySelectorAll('.item').forEach(el => {
    const q = countFor(el.dataset.id);
    el.querySelector('output').textContent = q;
    el.querySelector('.minus').disabled = q === 0;
    el.classList.toggle('has', q > 0);
  });
  const t = totals();
  $('review').disabled = t.count === 0 || data.paused;
  $('count').textContent = t.count ? `Review order · ${t.count} item${t.count > 1 ? 's' : ''}` : 'Add items to order';
  $('subtotal').textContent = t.count ? money(t.sub) : '';
}

function addLine(product, options, quantity) {
  const sig = options.slice().sort().join(',');
  const same = cart.find(l => l.product === product && l.options.slice().sort().join(',') === sig);
  if (same) same.quantity = Math.min(same.quantity + quantity, 50); else cart.push({ product, options, quantity });
  save(); update();
}
function removeOne(product) {
  for (let i = cart.length - 1; i >= 0; i--) if (cart[i].product === product) { if (--cart[i].quantity <= 0) cart.splice(i, 1); break; }
  save(); update();
}

// ----- sheets -----
function openSheet(el) { $('scrim').classList.add('open'); el.classList.add('open'); }
function closeSheets() { $('scrim').classList.remove('open'); document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); }
$('scrim').onclick = closeSheets;

function openOptions(it) {
  let qty = 1;
  const el = $('optSheet');
  const draw = () => {
    const chosen = [...el.querySelectorAll('input:checked')].map(i => i.value);
    const unit = it.amount + chosen.reduce((s, k) => s + (it.options.find(o => o.key === k)?.amount || 0), 0);
    el.querySelector('#q').textContent = qty;
    el.querySelector('#qm').disabled = qty <= 1;
    el.querySelector('#add').innerHTML = `<span>Add ${qty} to order</span><span>${money(unit * qty)}</span>`;
  };
  el.innerHTML = `<button class="close" aria-label="Close">✕</button>
    <h3>${esc(it.name)}</h3><div class="sub">${money(it.amount)}${it.description ? ' · ' + esc(it.description) : ''}</div>
    ${it.options.map(o => `<label class="opt ${o.sold_out ? 'out' : ''}"><input type="checkbox" value="${o.key}" ${o.sold_out ? 'disabled' : ''}>
      <span>${esc(o.label)}</span><small>${o.sold_out ? 'Sold out' : o.amount ? '+' + money(o.amount) : 'Free'}</small></label>`).join('')}
    <div class="step"><button id="qm">−</button><output id="q">1</output><button id="qp" class="plus">+</button></div>
    <button class="btn" id="add"></button>`;
  el.querySelector('.close').onclick = closeSheets;
  el.querySelectorAll('input').forEach(i => i.onchange = draw);
  el.querySelector('#qm').onclick = () => { qty = Math.max(1, qty - 1); draw(); };
  el.querySelector('#qp').onclick = () => { qty = Math.min(50, qty + 1); draw(); };
  el.querySelector('#add').onclick = () => { addLine(it.id, [...el.querySelectorAll('input:checked')].map(i => i.value), qty); closeSheets(); };
  draw(); openSheet(el);
}

function openCart() {
  const el = $('cartSheet');
  const t = totals();
  if (!t.count) return closeSheets();
  el.innerHTML = `<button class="close" aria-label="Close">✕</button><h3>Your order</h3><div class="sub">${menu[0].toUpperCase() + menu.slice(1)} menu</div>
    ${cart.map((l, idx) => { const it = byId[l.product]; return `<div class="line"><b>${l.quantity}×</b><div class="l">${esc(it.name)}
      ${l.options.length ? `<div class="o">${esc(l.options.map(k => it.options.find(o => o.key === k)?.label).join(', '))}</div>` : ''}</div>
      <div>${money(lineUnit(l) * l.quantity)}</div><button class="x" data-i="${idx}" aria-label="Remove">✕</button></div>`; }).join('')}
    <div style="margin-top:10px"><div class="sum"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    <div class="sum"><span>Tax (${data.tax_percent}%)</span><span>${money(t.tax)}</span></div>
    <div class="sum total"><span>Total</span><span>${money(t.total)}</span></div></div>
    <p style="color:var(--muted);font-size:14px">Next: pay with Apple Pay, Google Pay or card. Add your name and mobile number and we'll text you when it's ready.</p>
    <button class="btn" id="pay"><span>Pay</span><span>${money(t.total)}</span></button>`;
  el.querySelector('.close').onclick = closeSheets;
  el.querySelectorAll('.x').forEach(b => b.onclick = () => { cart.splice(Number(b.dataset.i), 1); save(); update(); openCart(); });
  el.querySelector('#pay').onclick = checkout;
  openSheet(el);
}

async function checkout(e) {
  const btn = e.currentTarget; btn.disabled = true; btn.firstElementChild.textContent = 'Opening secure checkout…';
  try {
    const r = await fetch(`/api/menu/${menu}/checkout`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ cart }) });
    const d = await r.json();
    if (d.url) { location.href = d.url; return; }
    alert(d.error || 'Checkout failed'); load();
  } catch (err) { alert('Checkout failed. Please try again.'); }
  btn.disabled = false; btn.firstElementChild.textContent = 'Pay';
}

$('menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const it = byId[b.closest('.item').dataset.id];
  if (b.classList.contains('minus')) return removeOne(it.id);
  if (it.options.length) openOptions(it); else addLine(it.id, [], 1);
});
$('review').onclick = openCart;

function load() {
  fetch('/api/menu/' + menu).then(r => r.json()).then(d => {
    if (d.error) throw 0;
    data = d; byId = Object.fromEntries(d.items.map(i => [i.id, i]));
    cart = cart.filter(l => byId[l.product] && !byId[l.product].sold_out)
      .map(l => ({ ...l, options: l.options.filter(k => byId[l.product].options.some(o => o.key === k && !o.sold_out)) }));
    save(); render();
  }).catch(() => { $('menu').innerHTML = '<div class="msg">Menu unavailable. Please try again in a moment.</div>'; });
}
load();
</script>
</body>
</html>
