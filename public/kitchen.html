<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>AlleyCat Kitchen</title>
<style>
  :root { --bg:#141210; --panel:#1f1c19; --line:#3a352f; --ink:#f6f1ea; --muted:#a39a8e; --brand:#e5572f; --ok:#35a54a; --warn:#f2b233; --red:#e0321f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button { font:inherit; cursor:pointer; }

  /* top bar */
  .top { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap; }
  .top h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; } .top h1 small { color:var(--muted); font-weight:500; margin-left:6px; }
  .counts { color:var(--muted); font-weight:700; font-size:15px; white-space:nowrap; }
  .counts b { color:var(--ink); } .counts .nw { color:#ff7a66; }
  .pill { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 13px; border-radius:999px; font-weight:700; font-size:15px; white-space:nowrap; }
  .pill.paused { background:var(--warn); color:#111; border-color:var(--warn); }
  .pill.mute { color:var(--warn); border-color:#6b5520; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--ok); display:inline-block; }
  .dot.bad { background:#d33; }

  /* main ticket area */
  main { flex:1; overflow-y:auto; padding:10px; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; align-items:start; }
  .t { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; }
  .th { display:flex; justify-content:space-between; align-items:center; padding:7px 11px; background:#2a2622; gap:6px; }
  .th .n { font-size:26px; font-weight:900; } .th .nm { font-size:17px; font-weight:700; margin-left:6px; }
  .th .who { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .age { font-weight:800; font-size:15px; color:var(--muted); white-space:nowrap; }
  .age.y { color:var(--warn); } .age.r { color:#ff6b5a; }
  .ti { padding:4px 11px 6px; }
  .li { padding:5px 0; border-bottom:1px dashed var(--line); font-size:18px; } .li:last-child { border:0; }
  .li b { color:var(--brand); margin-right:5px; }
  .li .o { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .li .o span { font-size:13px; font-weight:700; background:#3a2a20; color:#ffcfb8; padding:2px 7px; border-radius:5px; }
  .ta { padding:0 11px 11px; }
  .big { width:100%; padding:13px; border:0; border-radius:9px; font-weight:800; font-size:17px; color:#fff; background:var(--ok); }

  /* NEW = not started: red + pulsing */
  .t.new { border-color:var(--red); animation:pulse 1.6s ease-in-out infinite; }
  .t.new .th { background:var(--red); }
  .t.new .th .age { color:#fff; }
  .t.new .big { background:var(--red); }
  .t.new .tag { font-size:12px; font-weight:900; letter-spacing:.08em; background:#fff; color:var(--red); padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:3px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(224,50,31,.0); } 50% { box-shadow:0 0 0 6px rgba(224,50,31,.55); } }

  .empty { color:var(--muted); padding:50px 10px; text-align:center; border:1px dashed var(--line); border-radius:12px; }
  .more { position:absolute; left:50%; transform:translateX(-50%); bottom:62px; background:var(--brand); color:#fff; border:0; border-radius:999px; padding:9px 18px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.5); z-index:4; display:none; }

  /* completed bar */
  .done { flex:none; border-top:1px solid var(--line); background:#191715; }
  .doneBar { width:100%; display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:none; border:0; color:var(--muted); font-weight:800; font-size:15px; }
  .doneBar b { color:#8fd49b; }
  .doneList { max-height:0; overflow-y:auto; transition:max-height .2s; }
  .done.open .doneList { max-height:55vh; }
  .dr { display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid #2a2622; font-size:16px; }
  .dr .n { font-weight:900; font-size:18px; min-width:44px; }
  .dr .d { flex:1; min-width:0; } .dr .d small { display:block; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dr .tx { font-size:13px; font-weight:800; white-space:nowrap; } .dr .tx.ok { color:#8fd49b; } .dr .tx.bad { color:#ff8a7a; }
  .tipTag { color:#8fd49b; font-weight:800; font-size:13px; padding:0 11px 6px; }
  .dr .undo { border:1px solid var(--line); background:none; color:var(--muted); border-radius:8px; padding:7px 10px; font-weight:700; font-size:14px; }

  /* overlays + drawer */
  .overlay { position:fixed; inset:0; background:rgba(10,9,8,.96); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; z-index:20; text-align:center; padding:20px; }
  .overlay input { font-size:32px; letter-spacing:.3em; text-align:center; width:220px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  .cta { padding:18px 34px; font-size:20px; font-weight:800; border:0; border-radius:14px; background:var(--brand); color:#fff; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 100%); background:var(--panel); border-left:1px solid var(--line); z-index:10; transform:translateX(105%); transition:transform .2s; overflow:auto; padding:18px; }
  .drawer.open { transform:none; }
  .so { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); font-size:18px; }
  .so small { color:var(--muted); display:block; font-size:13px; }
  .tog { padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--ok); font-weight:800; min-width:110px; }
  .tog.out { background:#5a1d14; color:#ffb4a6; border-color:#8a2c1f; }
  .err { color:#ff8a7a; min-height:22px; }
</style>
</head>
<body>
<div class="top">
  <h1>AlleyCat Kitchen <small id="clock"></small></h1>
  <span class="counts" id="counts"></span>
  <span class="dot" id="dot" title="Live"></span>
  <button class="pill mute" id="soundBtn">🔇 Tap for sound</button>
  <button class="pill" id="soldBtn">Sold out</button>
  <button class="pill" id="pauseBtn">Ordering: ON</button>
</div>

<main id="main"><div class="grid" id="open"></div></main>
<button class="more" id="more"></button>

<div class="done" id="done">
  <button class="doneBar" id="doneBar"><span>✓ Completed today (<b id="doneN">0</b>)</span><span id="doneArrow">▲ Show</span></button>
  <div class="doneList" id="doneList"></div>
</div>

<div class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Sold out</h2><button class="pill" id="closeDrawer">Done</button></div>
  <p style="color:var(--muted)">Tap to mark sold out. It greys out on the phone menu right away.</p>
  <div id="soList"></div>
</div>

<div class="overlay" id="login" style="display:none">
  <h1 style="margin:0">AlleyCat Kitchen</h1>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <div class="err" id="pinErr"></div>
  <button class="cta" id="pinGo">Unlock</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orders = [], seen = null, paused = false, audio = null, wakeLock, busy = false;

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {});
  if (r.status === 401) { showLogin(); throw new Error('auth'); }
  return r.json();
}

// ---- sound + screen awake: unlocked by the first tap anywhere (browser rule) ----
function chime() {
  if (!audio || muted) return;
  const now = audio.currentTime;
  [0, 0.18, 0.36].forEach((t, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = [880, 1175, 1568][i]; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.6, now + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.35);
    o.connect(g).connect(audio.destination); o.start(now + t); o.stop(now + t + 0.4);
  });
}
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
// Sound on/off: remembered on this iPad across reloads
let muted = false, unlockedAt = 0;
try { muted = localStorage.getItem('kitchenMuted') === '1'; } catch (e) {}
function soundLabel() {
  const b = $('soundBtn');
  if (!audio) { b.textContent = '🔇 Tap for sound'; b.classList.add('mute'); return; }
  b.textContent = muted ? '🔇 Sound off' : '🔔 Sound on';
  b.classList.toggle('mute', muted);
}
function unlock() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); unlockedAt = Date.now(); } catch (e) {} }
  audio?.resume(); keepAwake(); soundLabel();
}
document.addEventListener('pointerdown', unlock, { once: true });
$('soundBtn').onclick = () => {
  const firstTap = !audio || Date.now() - unlockedAt < 1500; // the tap that turned sound on shouldn't also turn it off
  unlock();
  muted = firstTap ? false : !muted;
  try { localStorage.setItem('kitchenMuted', muted ? '1' : '0'); } catch (e) {}
  soundLabel();
  if (!muted) chime();
};
soundLabel();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(); } });

// ---- auth ----
function showLogin() { $('login').style.display = 'flex'; $('pin').focus(); }
$('pinGo').onclick = async () => {
  const r = await fetch('/api/kitchen/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin: $('pin').value }) });
  const d = await r.json();
  if (!d.ok) { $('pinErr').textContent = d.error || 'Wrong PIN'; return; }
  $('login').style.display = 'none'; unlock(); poll();
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('pinGo').click(); };

// ---- rendering ----
const mins = s => Math.floor((Date.now() / 1000 - s) / 60);
const ageTxt = m => m < 1 ? 'now' : m + ' min';
const timeTxt = s => new Date(s * 1000).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

function ticket(o) {
  const isNew = o.status === 'new';
  const m = mins(o.placed_at);
  return `<div class="t ${isNew ? 'new' : 'cooking'}">
    <div class="th"><div class="who"><span class="n">#${o.order_no}</span><span class="nm">${esc(o.name)}</span>${isNew ? '<span class="tag">NEW</span>' : ''}</div>
      <span class="age ${m >= 10 ? 'r' : m >= 5 ? 'y' : ''}">${ageTxt(m)}</span></div>
    <div class="ti">${o.items.map(i => `<div class="li"><b>${i.qty}×</b>${esc(i.name)}${i.options.length ? `<div class="o">${i.options.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}</div>`).join('')}</div>
    ${o.tip ? `<div class="tipTag">💵 ${'$' + (o.tip / 100).toFixed(2)} tip</div>` : ''}
    <div class="ta">${isNew
      ? `<button class="big" data-id="${o.id}" data-s="cooking">▶ START</button>`
      : `<button class="big" data-id="${o.id}" data-s="ready">✓ Ready → text ${o.phone_last4 ? '•' + o.phone_last4 : 'customer'}</button>`}</div></div>`;
}

function render() {
  const open = orders.filter(o => o.status === 'new' || o.status === 'cooking').sort((a, b) => a.order_no - b.order_no);
  const done = orders.filter(o => o.status === 'ready' || o.status === 'done').sort((a, b) => (b.ready_at || b.placed_at) - (a.ready_at || a.placed_at) || b.order_no - a.order_no);
  const nNew = open.filter(o => o.status === 'new').length;
  $('open').innerHTML = open.map(ticket).join('') || '<div class="empty" style="grid-column:1/-1">No open orders. New ones show up here in red.</div>';
  $('counts').innerHTML = `<span class="nw">${nNew} new</span> · <b>${open.length - nNew}</b> cooking`;
  $('doneN').textContent = done.length;
  $('doneList').innerHTML = done.map(o => `<div class="dr"><span class="n">#${o.order_no}</span>
      <div class="d">${esc(o.name)} · ${o.ready_at ? timeTxt(o.ready_at) : ''}<small>${o.tip ? '💵 $' + (o.tip / 100).toFixed(2) + ' tip · ' : ''}${o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</small></div>
      ${o.text_status === 'sent' ? '<span class="tx ok">✓ texted</span>' : o.text_status === 'failed' ? '<span class="tx bad">⚠ not texted</span>' : ''}
      <button class="undo" data-id="${o.id}" data-s="cooking">Undo</button></div>`).join('') || '<div class="dr" style="color:var(--muted)">Nothing completed yet today</div>';
  $('pauseBtn').textContent = paused ? '⏸ Ordering: PAUSED' : 'Ordering: ON';
  $('pauseBtn').classList.toggle('paused', paused);
  updateMore();
}

// "+N more" when tickets are hidden below the fold
function updateMore() {
  const main = $('main'), bottom = main.getBoundingClientRect().bottom;
  const hidden = [...document.querySelectorAll('#open .t')].filter(t => t.getBoundingClientRect().top > bottom - 40).length;
  const b = $('more');
  b.style.display = hidden ? 'block' : 'none';
  b.style.bottom = ($('done').offsetHeight + 12) + 'px';
  b.textContent = `▼ ${hidden} more order${hidden > 1 ? 's' : ''}`;
}
$('main').addEventListener('scroll', updateMore);
window.addEventListener('resize', updateMore);
$('more').onclick = () => $('main').scrollBy({ top: $('main').clientHeight * 0.8, behavior: 'smooth' });

async function poll() {
  if (busy) return;
  try {
    const d = await api('/api/kitchen/orders');
    if (d.error) throw new Error(d.error);
    paused = d.paused; orders = d.orders;
    if (seen && orders.some(o => !seen.has(o.id) && o.status === 'new')) chime();
    seen = new Set(orders.map(o => o.id));
    $('dot').classList.remove('bad');
    render();
  } catch (e) { if (e.message !== 'auth') $('dot').classList.add('bad'); }
}

document.body.addEventListener('click', async e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  b.disabled = true; busy = true;
  const o = orders.find(x => x.id === b.dataset.id); if (o) { o.status = b.dataset.s; if (b.dataset.s === 'ready') o.ready_at = Math.floor(Date.now() / 1000); render(); }
  try { await api(`/api/kitchen/orders/${b.dataset.id}/status`, { status: b.dataset.s }); } catch (err) { if (err.message !== 'auth') alert('Could not update. Check Wi-Fi.'); }
  busy = false; poll();
});

$('doneBar').onclick = () => {
  const open = $('done').classList.toggle('open');
  $('doneArrow').textContent = open ? '▼ Hide' : '▲ Show';
  setTimeout(updateMore, 250);
};

// ---- pause + sold out ----
$('pauseBtn').onclick = async () => {
  const next = !paused;
  if (next && !confirm('Pause online ordering? Customers will see "ordering paused" and can\'t check out.')) return;
  await api('/api/kitchen/pause', { paused: next }); paused = next; render();
};
async function loadSold() {
  const d = await api('/api/kitchen/items');
  $('soList').innerHTML = d.items.map(i => `<div class="so"><div>${esc(i.name)}${i.option ? '<small>Add-on / sauce</small>' : ''}</div>
    <button class="tog ${i.sold_out ? 'out' : ''}" data-p="${i.id}" data-v="${!i.sold_out}">${i.sold_out ? 'SOLD OUT' : 'Available'}</button></div>`).join('');
}
$('soList').onclick = async e => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  b.disabled = true; await api(`/api/kitchen/items/${b.dataset.p}/soldout`, { sold_out: b.dataset.v === 'true' }); loadSold();
};
$('soldBtn').onclick = () => { $('drawer').classList.add('open'); loadSold(); };
$('closeDrawer').onclick = () => $('drawer').classList.remove('open');

// ---- auto-reload when a new version is deployed (stays logged in) ----
let build = null;
async function checkVersion() {
  try { const { v } = await (await fetch('/api/version', { cache: 'no-store' })).json(); if (build && v !== build) location.reload(); build = v; } catch (e) {}
}

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }, 1000);
setInterval(poll, 4000);
setInterval(render, 30000);
setInterval(checkVersion, 30000); checkVersion();
fetch('/api/kitchen/orders').then(r => { if (r.status === 401) showLogin(); else poll(); });
</script>
</body>
</html>
